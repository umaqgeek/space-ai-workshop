<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1490" role="img" aria-labelledby="title desc">
  <title id="title">SpaceLab question-to-answer process flow</title>
  <desc id="desc">A submitted question is validated. Invalid input returns an HTTP error. BM25 retrieves matching records. Missing sources or requests for live data and predictions produce insufficient-evidence responses without a model call. Otherwise excerpt mode composes source text, while AI mode calls the configured Ollama model. Missing, invalid citations or model errors fall back to excerpts. The API returns the answer, sources and actual mode. The browser displays the answer above clarification and references, and users verify and download it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#50704d"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,sans-serif;fill:#243c30;text-anchor:middle}
      .heading{font-size:20px;font-weight:650}.body{font-size:15px;fill:#53674f}.label{font-size:13px;font-weight:650;fill:#69825b}.box{fill:white;stroke:#c9d7bf;stroke-width:1.5}.decision{fill:#eaf2dd;stroke:#aabe96;stroke-width:1.5}.warning{fill:#fff6e6;stroke:#dfcda9;stroke-width:1.5}.line{fill:none;stroke:#50704d;stroke-width:2;marker-end:url(#arrow)}.fallback{stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1200" height="1490" fill="#fafcf7"/>
  <rect class="box" x="380" y="25" width="440" height="70" rx="15"/>
  <text class="heading" x="600" y="54">Submit question + settings</text>
  <text class="body" x="600" y="79">Browser → POST /api/ask</text>
  <path class="line" d="M600 95V120"/>
  <polygon class="decision" points="600,120 755,180 600,240 445,180"/>
  <text class="heading" x="600" y="178">Valid request?</text>
  <text class="body" x="600" y="200">Size, question and settings</text>
  <path class="line" d="M755 180H940"/><text class="label" x="845" y="166">No</text>
  <rect class="warning" x="940" y="140" width="220" height="85" rx="12"/>
  <text class="heading" x="1050" y="171">HTTP 400 / 413</text>
  <text class="body" x="1050" y="197">Show error; revise input</text>
  <path class="line" d="M600 240V280"/><text class="label" x="621" y="264">Yes</text>
  <rect class="box" x="380" y="280" width="440" height="90" rx="12"/>
  <text class="heading" x="600" y="312">Retrieve source records</text>
  <text class="body" x="600" y="338">Token aliases + place / topic constraints</text>
  <text class="body" x="600" y="358">BM25 ranks matches → top 1–6 records</text>
  <path class="line" d="M600 370V405"/>
  <polygon class="decision" points="600,405 765,465 600,525 435,465"/>
  <text class="heading" x="600" y="459">Evidence available?</text>
  <text class="body" x="600" y="482">No live-data / prediction request</text>
  <path class="line" d="M765 465H940"/><text class="label" x="850" y="450">No</text>
  <rect class="warning" x="940" y="418" width="220" height="100" rx="12"/>
  <text class="heading" x="1050" y="447">Insufficient evidence</text>
  <text class="body" x="1050" y="473">No model call</text>
  <text class="body" x="1050" y="495">Related sources if available</text>
  <path class="line" d="M600 525V560"/><text class="label" x="621" y="548">Yes</text>
  <polygon class="decision" points="600,560 750,620 600,680 450,620"/>
  <text class="heading" x="600" y="618">AI mode requested?</text>
  <text class="body" x="600" y="641">Otherwise use excerpt mode</text>

  <path class="line" d="M450 620H320"/><text class="label" x="385" y="605">No</text>
  <rect class="box" x="40" y="585" width="280" height="105" rx="12"/>
  <text class="heading" x="180" y="616">Compose excerpts</text>
  <text class="body" x="180" y="644">Source text + IDs + limitations</text>
  <text class="label" x="180" y="670">ACTUAL MODE: OFFLINE</text>

  <path class="line" d="M750 620H880"/><text class="label" x="815" y="605">Yes</text>
  <rect class="box" x="880" y="585" width="280" height="105" rx="12"/>
  <text class="heading" x="1020" y="615">Call Ollama /api/chat</text>
  <text class="body" x="1020" y="641">Prompt + question + sources</text>
  <text class="body" x="1020" y="665">Configured model, auth and timeout</text>
  <path class="line" d="M1020 690V740"/>
  <polygon class="decision" points="1020,740 1170,805 1020,870 870,805"/>
  <text class="heading" x="1020" y="793">Usable model answer?</text>
  <text class="body" x="1020" y="818">Nonempty; citation IDs exist</text>
  <text class="body" x="1020" y="838">and belong to retrieved sources</text>
  <path class="line fallback" d="M870 805H730"/><text class="label" x="800" y="789">No / error</text>
  <rect class="warning" x="490" y="763" width="240" height="85" rx="12"/>
  <text class="heading" x="610" y="795">Record fallback notice</text>
  <text class="body" x="610" y="822">Use existing excerpt answer</text>
  <path class="line fallback" d="M490 805H355V660H320"/>
  <path class="line" d="M1020 870V920"/><text class="label" x="1040" y="898">Yes</text>
  <rect class="box" x="880" y="920" width="280" height="85" rx="12"/>
  <text class="heading" x="1020" y="953">Keep generated answer</text>
  <text class="label" x="1020" y="981">ACTUAL MODE: QWEN*</text>
  <text class="body" x="990" y="1041">*Internal mode name; model is configurable.</text>

  <rect class="box" x="370" y="1100" width="460" height="95" rx="12"/>
  <text class="heading" x="600" y="1135">Return JSON response</text>
  <text class="body" x="600" y="1165">answer · sources · actual mode · status · notice</text>
  <path class="line" d="M180 690V1147H370"/>
  <path class="line" d="M1020 1005V1147H830"/>
  <path class="line" d="M1160 468H1185V1147H1027"/>
  <circle cx="1020" cy="1147" r="4" fill="#50704d"/>
  <path class="line" d="M600 1195V1240"/>
  <rect class="box" x="370" y="1240" width="460" height="85" rx="12"/>
  <text class="heading" x="600" y="1274">Render response in the browser</text>
  <text class="body" x="600" y="1303">Answer first → Clarification → References</text>
  <path class="line" d="M600 1325V1370"/>
  <rect class="box" x="370" y="1370" width="460" height="85" rx="15"/>
  <text class="heading" x="600" y="1404">Verify claims against source records</text>
  <text class="body" x="600" y="1433">Optional: download response + references as JSON</text>
</svg>
